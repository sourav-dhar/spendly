<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spendly{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <div class="page-frame">

        <nav class="navbar">
            <div class="nav-inner">
                <div class="nav-links-left">
                    <a href="{{ url_for('landing') }}">About us</a>
                    <a href="{{ url_for('landing') }}">Features</a>
                    <a href="{{ url_for('landing') }}">Pricing</a>
                </div>
                <a href="{{ url_for('landing') }}" class="nav-brand">
                    <span class="brand-icon">◈</span>
                    <span class="brand-name">Spendly</span>
                </a>
                <div class="nav-links-right">
                    <a href="{{ url_for('login') }}">Sign in</a>
                    <a href="{{ url_for('register') }}" class="nav-cta">
                        Get started
                        <span class="nav-cta-icon">↗</span>
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <div class="footer-inner">
                <span class="brand-icon">◈</span>
                <span class="footer-name">Spendly</span>
                <p class="footer-copy">Track every rupee. Own your finances.</p>
                <div class="footer-links">
                    <a href="/terms">Terms and Conditions</a>
                    <a href="/privacy">Privacy Policy</a>
                </div>
            </div>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
